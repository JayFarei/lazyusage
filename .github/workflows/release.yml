name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Exercise the pipeline with `npm publish --dry-run` (no tag check, no GitHub release)"
        type: boolean
        default: true

# id-token lets npm authenticate this workflow through OIDC (trusted
# publishing): no npm token, no 2FA code. Each package must list this
# workflow as a trusted publisher on npmjs.com (Package settings ->
# Publishing access -> Trusted publisher: GitHub Actions, owner JayFarei,
# repository lazyusage, workflow release.yml).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node LTS is older.
      # No registry-url / auth token here on purpose: a configured token would take
      # precedence over OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with trusted publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: |
          bun test tests/core/
          bun run test:tui
          bun test tests/cli/

      - name: Build
        run: bun run build

      - name: Smoke test packaged CLI
        run: bun run test:smoke

      - name: Verify tag matches package versions
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/cli; do
            PKG_VERSION=$(jq -r .version "$pkg/package.json")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg is at $PKG_VERSION but tag is $TAG_VERSION"
              exit 1
            fi
          done

      - name: Extract changelog notes
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" > release-notes.md
          fi

      # Created before the npm publish and idempotent, so a failed publish can be
      # re-run from the Actions tab without touching the release.
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      # Already-published versions are skipped so re-running a release is
      # idempotent. The CLI is published from a `bun pm pack` tarball because bun
      # resolves its `workspace:*` dependency from the lockfile; npm would ship the
      # literal spec (the 0.2.0 / 0.2.1 breakage).
      - name: Publish to npm (trusted publishing)
        run: |
          set -euo pipefail
          FLAGS="--access public --provenance"
          if [ "$DRY_RUN" = "true" ]; then
            # npm refuses to dry-run a version that is already published, so use a
            # throwaway prerelease (which npm requires to carry an explicit tag).
            # The CLI tarball still pins lazyusage-core to the lockfile version.
            FLAGS="$FLAGS --dry-run --tag dryrun"
            for pkg in packages/core packages/cli; do
              (cd "$pkg" && npm pkg set version="$(jq -r .version package.json)-dryrun.${GITHUB_RUN_ID}")
            done
          fi

          publish_needed() {
            if [ "$DRY_RUN" = "true" ]; then return 0; fi
            if npm view "$1@$2" version >/dev/null 2>&1; then
              echo "$1@$2 already on npm, skipping"
              return 1
            fi
            return 0
          }

          CORE_VERSION=$(jq -r .version packages/core/package.json)
          if publish_needed lazyusage-core "$CORE_VERSION"; then
            (cd packages/core && npm publish $FLAGS)
          fi

          CLI_VERSION=$(jq -r .version packages/cli/package.json)
          if publish_needed lazyusage "$CLI_VERSION"; then
            mkdir -p pack
            (cd packages/cli && bun pm pack --destination ../../pack)
            # Explicit ./ prefix: npm parses "pack/name.tgz" as the GitHub shorthand pack/name
            npm publish "./pack/lazyusage-$CLI_VERSION.tgz" $FLAGS
          fi
